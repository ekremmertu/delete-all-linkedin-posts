<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #191919;
        --soft: #5e6a72;
        --line: #e2e6ea;
        --mavi: #0a66c2;
        --kirmizi: #b42318;
        --kirmizi-bg: #fef3f2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1f23;
          --fg: #f2f4f6;
          --soft: #9aa5ad;
          --line: #2f363d;
          --mavi: #4d9bea;
          --kirmizi: #ff8b7e;
          --kirmizi-bg: #2b1a18;
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      h1 { font-size: 15px; margin: 0 0 12px; }
      .sayac {
        text-align: center;
        padding: 14px 0 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        margin-bottom: 12px;
      }
      .sayac b { display: block; font-size: 34px; line-height: 1.1; }
      .sayac span { color: var(--soft); font-size: 12px; }
      .mod { display: flex; gap: 6px; margin-bottom: 10px; }
      .mod button {
        flex: 1;
        padding: 8px 6px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
        border-radius: 8px;
        cursor: pointer;
        font-size: 12.5px;
      }
      .mod button[data-secili="1"] { border-color: var(--mavi); color: var(--mavi); font-weight: 600; }
      #uyari {
        display: none;
        background: var(--kirmizi-bg);
        color: var(--kirmizi);
        border-radius: 8px;
        padding: 9px 10px;
        font-size: 12.5px;
        margin-bottom: 10px;
      }
      #anaDugme {
        width: 100%;
        padding: 13px;
        font-size: 15px;
        font-weight: 600;
        border: 0;
        border-radius: 9px;
        background: var(--mavi);
        color: #fff;
        cursor: pointer;
      }
      #anaDugme[data-dur="1"] { background: var(--kirmizi); }
      #anaDugme:disabled { opacity: 0.5; cursor: default; }
      #ipucu { color: var(--soft); font-size: 12px; margin-top: 10px; text-align: center; }
      details { margin-top: 12px; font-size: 12.5px; color: var(--soft); }
      details label { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
      details input { width: 74px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px;
                      background: transparent; color: var(--fg); }
      #sifirla { margin-top: 10px; background: none; border: 0; color: var(--soft);
                 text-decoration: underline; cursor: pointer; font-size: 12px; padding: 0; }
    </style>
  </head>
  <body>
    <h1>LinkedIn Post Cleaner</h1>

    <div class="sayac">
      <b id="sayi">0</b>
      <span id="etiket">—</span>
    </div>

    <div class="mod">
      <button id="modProva" data-secili="1"></button>
      <button id="modSil"></button>
    </div>

    <div id="uyari"></div>

    <button id="anaDugme"></button>
    <div id="ipucu"></div>

    <details>
      <summary id="ayarBaslik"></summary>
      <label><span id="etiketYenileme"></span><input id="yenileme" type="number" min="10" max="200" /></label>
      <label><span id="etiketBekleme"></span><input id="bekleme" type="number" min="1" max="30" /></label>
      <button id="sifirla"></button>
    </details>

    <script src="popup.js"></script>
  </body>
</html>
